
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latif Hospital Attendance</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    .container {
      max-width: 700px;
      margin: 25px auto;
    }
    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #00000012;
    }
    h2, h3 { text-align: center; }
    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: none;
      background: #087c58;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .checkout { background: #2563eb; }
    .logout { background: #dc2626; }
    .record {
      padding: 12px;
      margin: 10px 0;
      background: #f1f5f9;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .message {
      text-align: center;
      font-weight: bold;
      color: #075985;
      overflow-wrap: anywhere;
    }
    .small {
      color: #64748b;
      font-size: 13px;
    }
    #app, #admin { display: none; }
  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <h2>Latif Orthopedic Hospital</h2>
    <p class="subtitle">Physiotherapy Center - Muridke</p>
    <p class="subtitle">Staff Attendance Management System</p>
  </div>

  <!-- LOGIN -->
  <div class="card" id="login">
    <h3>Staff Login</h3>

    <input id="email" type="email" placeholder="Enter Email">
    <input id="password" type="password" placeholder="Enter Password">

    <button id="loginButton" onclick="login()">Login</button>
    <p id="message" class="message"></p>
  </div>

  <!-- STAFF DASHBOARD -->
  <div class="card" id="app">
    <h3 id="welcome">Welcome</h3>
    <p id="todayDate" class="subtitle"></p>

    <button onclick="checkIn()">CHECK IN</button>
    <button class="checkout" onclick="checkOut()">CHECK OUT</button>

    <p id="attendanceMessage" class="message"></p>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div class="card" id="admin">
    <h3>Admin Dashboard</h3>

    <input
      id="searchName"
      placeholder="Search Staff Name"
      oninput="filterRecords()"
    >

    <label>Daily Report</label>
    <input
      id="dailyDate"
      type="date"
      onchange="filterRecords()"
    >

    <label>Monthly Report</label>
    <input
      id="monthlyDate"
      type="month"
      onchange="filterRecords()"
    >

    <p id="recordCount" class="message"></p>
    <div id="records">Loading records...</div>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // FIREBASE CONFIGURATION
  firebase.initializeApp({
    apiKey: AIzaSyBunC8KPG1ZXSLkpS-B3jq02sFTs_uU4fQ
    authDomain: "latif-hospital-attendance.firebaseapp.com",
    projectId: "latif-hospital-attendance",
    storageBucket: "latif-hospital-attendance.firebasestorage.app",
    messagingSenderId: "197742542724",
    appId: "1:197742542724:web:9f9903c333c7b3981ba7d1",
    measurementId: "G-EZW9BYGNW4"
  });

  const auth = firebase.auth();
  const db = firebase.firestore();

  let staff = null;
  let currentUser = null;
  let allRecords = [];

  // HOSPITAL GPS LOCATION
  const HOSPITAL_LAT = 31.796576833446725;
  const HOSPITAL_LNG = 74.25336237431742;

  // ATTENDANCE ALLOWED RADIUS
  const ALLOWED_RADIUS = 200;

  // PAKISTAN DATE
  function pakistanDate() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Karachi",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  // PAKISTAN TIME
  function pakistanTime() {
    return new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Karachi",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    }).format(new Date());
  }

  // GPS DISTANCE CALCULATION
  function distanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = value => value * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) ** 2;

    return 2 * R * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );
  }

  // VERIFY HOSPITAL LOCATION
  function verifyHospitalLocation(message) {
    return new Promise(resolve => {

      if (!navigator.geolocation) {
        message.innerText = "GPS is not supported on this device.";
        resolve(false);
        return;
      }

      message.innerText = "Checking your GPS location...";

      navigator.geolocation.getCurrentPosition(
        position => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const distance = distanceInMeters(
            latitude,
            longitude,
            HOSPITAL_LAT,
            HOSPITAL_LNG
          );

          if (accuracy > 200) {
            message.innerText =
              "GPS accuracy is too low: " +
              Math.round(accuracy) +
              " meters. Please try again.";
            resolve(false);
            return;
          }

          if (distance <= ALLOWED_RADIUS) {
            message.innerText =
              "Hospital location verified. Distance: " +
              Math.round(distance) + " meters.";

            resolve(true);

          } else {
            message.innerText =
              "GPS Distance: " + Math.round(distance) +
              " meters. GPS Accuracy: " +
              Math.round(accuracy) + " meters.";

            resolve(false);
          }
        },

        error => {
          message.innerText =
            "Please enable phone location and allow website GPS permission.";
          resolve(false);
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });
  }

  // LOGIN
  async function login() {

    const msg = document.getElementById("message");
    const button = document.getElementById("loginButton");

    try {
      button.disabled = true;
      msg.innerText = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        msg.innerText = "Please enter email and password.";
        return;
      }

      const result =
        await auth.signInWithEmailAndPassword(email, password);

      await loadUserProfile(result.user);

    } catch (error) {
      msg.innerText = "Error: " + error.message;
      console.error(error);

    } finally {
      button.disabled = false;
    }
  }

  // LOAD STAFF PROFILE
  async function loadUserProfile(user) {

    const msg = document.getElementById("message");

    try {
      const doc = await db.collection("STAFF").doc(user.uid).get();

      if (!doc.exists) {
        msg.innerText = "Staff profile not found.";
        await auth.signOut();
        return;
      }

      staff = doc.data();
      currentUser = user;

      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";

      document.getElementById("welcome").innerText =
        "Welcome, " + (staff.name || "Staff");

      document.getElementById("todayDate").innerText =
        "Date: " + pakistanDate();

      if (staff.role === "admin") {
        document.getElementById("admin").style.display = "block";
        await loadRecords();
      }

    } catch (error) {
      msg.innerText = "Profile Error: " + error.message;
      console.error(error);
    }
  }

  // CHECK IN
  async function checkIn() {

    const msg = document.getElementById("attendanceMessage");

    try {
      if (!currentUser) return;

      const locationAllowed = await verifyHospitalLocation(msg);
      if (!locationAllowed) return;

      const date = pakistanDate();
      const recordId = currentUser.uid + "_" + date;

      const ref = db.collection("attendance").doc(recordId);
      const existing = await ref.get();

      if (existing.exists) {
        msg.innerText = "You have already checked in today.";
        return;
      }

      await ref.set({
        uid: currentUser.uid,
        name: staff.name || "Staff",
        date: date,
        checkIn: pakistanTime(),
        checkOut: "",
        status: "Present",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      msg.innerText = "Check In successful!";

      if (staff.role === "admin") {
        await loadRecords();
      }

    } catch (error) {
      msg.innerText = "Error: " + error.message;
      console.error(error);
    }
  }

  // CHECK OUT
  async function checkOut() {

    const msg = document.getElementById("attendanceMessage");

    try {
      if (!currentUser) return;

      const locationAllowed = await verifyHospitalLocation(msg);
      if (!locationAllowed) return;

      const date = pakistanDate();
      const recordId = currentUser.uid + "_" + date;

      const ref = db.collection("attendance").doc(recordId);
      const existing = await ref.get();

      if (!existing.exists) {
        msg.innerText = "Please Check In first.";
        return;
      }

      if (existing.data().checkOut) {
        msg.innerText = "You have already checked out today.";
        return;
      }

      await ref.update({
        checkOut: pakistanTime(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      msg.innerText = "Check Out successful!";

      if (staff.role === "admin") {
        await loadRecords();
      }

    } catch (error) {
      msg.innerText = "Error: " + error.message;
      console.error(error);
    }
  }

  // ADMIN RECORDS
  async function loadRecords() {

    const output = document.getElementById("records");
    output.innerText = "Loading records...";

    try {
      const snapshot = await db.collection("attendance")
        .orderBy("date", "desc")
        .limit(300)
        .get();

      allRecords = [];

      snapshot.forEach(doc => {
        allRecords.push(doc.data());
      });

      filterRecords();

    } catch (error) {
      output.innerText =
        "Could not load records: " + error.message;
      console.error(error);
    }
  }

  // SEARCH AND REPORT FILTERS
  function filterRecords() {

    const search =
      document.getElementById("searchName").value
        .trim().toLowerCase();

    const daily =
      document.getElementById("dailyDate").value;

    const monthly =
      document.getElementById("monthlyDate").value;

    const filtered = allRecords.filter(record => {

      const name = (record.name || "").toLowerCase();

      const matchesName = name.includes(search);
      const matchesDay = !daily || record.date === daily;

      const matchesMonth = !monthly ||
        (record.date || "").startsWith(monthly);

      return matchesName && matchesDay && matchesMonth;
    });

    document.getElementById("recordCount").innerText =
      "Total records: " + filtered.length;

    const output = document.getElementById("records");
    output.innerHTML = "";

    if (filtered.length === 0) {
      output.innerText = "No attendance records found.";
      return;
    }

    filtered.forEach(record => {

      const div = document.createElement("div");
      div.className = "record";

      const name = document.createElement("strong");
      name.textContent = record.name || "Staff";

      const details = document.createElement("p");

      details.textContent =
        "Date: " + (record.date || "") +
        " | Check In: " + (record.checkIn || "Not checked in") +
        " | Check Out: " + (record.checkOut || "Not checked out");

      const status = document.createElement("p");
      status.className = "small";
      status.textContent = "Status: " + (record.status || "Present");

      div.appendChild(name);
      div.appendChild(details);
      div.appendChild(status);

      output.appendChild(div);
    });
  }

  // LOGOUT
  async function logout() {
    try {
      await auth.signOut();
      location.reload();
    } catch (error) {
      alert(error.message);
    }
  }

  // RESTORE LOGIN SESSION
  auth.onAuthStateChanged(async user => {
    if (user) {
      await loadUserProfile(user);
    }
  });

</script>

</body>
</html>
