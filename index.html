
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latif Hospital Attendance</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef3f8;margin:0;padding:15px;color:#17324d}
.container{max-width:900px;margin:20px auto;background:white;padding:22px;border-radius:12px;box-shadow:0 3px 15px #0002}
h1,h2{text-align:center;color:#087e8b}
.subtitle{text-align:center;color:#64748b}
input,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ccd5df;border-radius:7px;font-size:16px}
button{background:#087e8b;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.green{background:#16803c}.orange{background:#d97706}.red{background:#b42318}
.hidden{display:none!important}
.message{padding:12px;margin:10px 0;background:#e0f2fe;border-radius:7px;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
td,th{border:1px solid #ddd;padding:9px;text-align:left}
th{background:#e0f2fe}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;padding:15px;background:#e0f2fe;border-radius:8px;text-align:center}
#cameraVideo{width:100%;max-width:420px;display:block;margin:10px auto;background:#111;border-radius:10px}
.photoPreview{width:100%;max-width:220px;display:block;margin:10px auto;border-radius:10px}
.cameraButtons{display:flex;gap:8px;flex-wrap:wrap}
.cameraButtons button{flex:1;min-width:120px}
</style>
</head>
<body>
<div class="container">
<h1>Latif Orthopedic Hospital</h1>
<p class="subtitle">Physiotherapy Center — Muridke</p>
<p class="subtitle" id="clock"></p>

<div id="loginSection">
<h2>Staff Login</h2>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" onclick="login()">LOGIN</button>
<div id="loginMessage" class="message">Enter your email and password.</div>
</div>

<div id="staffSection" class="hidden">
<h2 id="welcome"></h2>
<div id="attendanceMessage" class="message">Attendance Panel</div>

<h3>Live Camera — Required</h3>
<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="cameraCanvas" class="hidden"></canvas>
<img id="photoPreview" class="photoPreview hidden" alt="Captured attendance photo">

<div class="cameraButtons">
<button id="startCameraBtn" onclick="startCamera()">OPEN LIVE CAMERA</button>
<button id="captureBtn" class="green" onclick="capturePhoto()" disabled>TAKE PHOTO</button>
<button id="retakeBtn" class="orange hidden" onclick="retakePhoto()">RETAKE PHOTO</button>
</div>

<p id="cameraMessage" class="message">Camera open karein aur apni photo lein.</p>

<button class="green" id="inBtn" onclick="markAttendance('in')">CHECK IN</button>
<button class="orange" id="outBtn" onclick="markAttendance('out')">CHECK OUT</button>

<h3>My Attendance</h3>
<div id="myRecords"></div>
<button class="red" onclick="logout()">LOGOUT</button>
</div>

<div id="adminSection" class="hidden">
<h2>Admin Dashboard</h2>
<div class="stats">
<div class="stat"><b id="totalRecords">0</b><br>Total Records</div>
<div class="stat"><b id="presentToday">0</b><br>Today's Check-ins</div>
</div>
<input id="searchStaff" placeholder="Search staff name" oninput="renderRecords()">
<label>Daily Report</label>
<input type="date" id="filterDay" onchange="renderRecords()">
<label>Monthly Report</label>
<input type="month" id="filterMonth" onchange="renderRecords()">
<button onclick="clearFilters()">Clear Filters</button>
<button onclick="loadAdminRecords()">Refresh Records</button>
<div id="adminMessage" class="message"></div>
<div class="tablewrap">
<table>
<thead>
<tr><th>Name</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th><th>Photos</th></tr>
</thead>
<tbody id="recordsBody"></tbody>
</table>
</div>
<button class="red" onclick="logout()">LOGOUT</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBunC8KPG1ZXSLkpS-B3jq02sFTs_uU4fQ",
  authDomain: "latif-hospital-attendance.firebaseapp.com",
  projectId: "latif-hospital-attendance",
  storageBucket: "latif-hospital-attendance.firebasestorage.app",
  messagingSenderId: "197742542724",
  appId: "1:197742542724:web:9f9903c333c7b3981ba7d1",
  measurementId: "G-EZW9BYGNW4"
};

let auth,db,currentUser=null,currentStaff=null,records=[];
let cameraStream=null;
let capturedPhoto="";

function showMessage(id,text){
  const el=document.getElementById(id);
  el.textContent=text;
  el.classList.remove("hidden");
}

function datePK(){
  return new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Karachi",year:"numeric",month:"2-digit",day:"2-digit"
  }).format(new Date());
}

function timePK(){
  return new Intl.DateTimeFormat("en-PK",{
    timeZone:"Asia/Karachi",hour:"2-digit",minute:"2-digit",
    second:"2-digit",hour12:true
  }).format(new Date());
}

function updateClock(){
  document.getElementById("clock").textContent=
    "Pakistan Date: "+datePK()+" | Time: "+timePK();
}
updateClock();
setInterval(updateClock,1000);

function showSection(id){
  ["loginSection","staffSection","adminSection"].forEach(x=>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
  if(id!=="staffSection")stopCamera();
}

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream=null;
  }
  document.getElementById("cameraVideo").srcObject=null;
  document.getElementById("captureBtn").disabled=true;
}

window.startCamera=async function(){
  const message=document.getElementById("cameraMessage");
  const startBtn=document.getElementById("startCameraBtn");
  const captureBtn=document.getElementById("captureBtn");

  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error("Camera is not supported. Website HTTPS par kholein.");
    }

    stopCamera();
    capturedPhoto="";
    document.getElementById("photoPreview").classList.add("hidden");
    document.getElementById("retakeBtn").classList.add("hidden");

    message.textContent="Camera open ho raha hai...";
    startBtn.disabled=true;

    cameraStream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:"user",
        width:{ideal:640},
        height:{ideal:480}
      }
    });

    document.getElementById("cameraVideo").srcObject=cameraStream;
    await document.getElementById("cameraVideo").play();

    captureBtn.disabled=false;
    message.textContent="Camera ready hai. TAKE PHOTO dabayein.";
  }catch(e){
    message.textContent="Camera error: "+e.message+
      " Browser mein camera permission allow karein.";
    stopCamera();
  }finally{
    startBtn.disabled=false;
  }
};

window.capturePhoto=function(){
  const video=document.getElementById("cameraVideo");
  const canvas=document.getElementById("cameraCanvas");
  const preview=document.getElementById("photoPreview");

  if(!cameraStream||!video.videoWidth){
    showMessage("cameraMessage","Pehle live camera open karein.");
    return;
  }

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const context=canvas.getContext("2d");
  context.drawImage(video,0,0,canvas.width,canvas.height);

  let quality=0.65;
  capturedPhoto=canvas.toDataURL("image/jpeg",quality);

  while(capturedPhoto.length>220000&&quality>0.25){
    quality-=0.10;
    capturedPhoto=canvas.toDataURL("image/jpeg",quality);
  }

  if(capturedPhoto.length>250000){
    capturedPhoto="";
    showMessage("cameraMessage","Photo size zyada hai. Dobara photo lein.");
    return;
  }

  preview.src=capturedPhoto;
  preview.classList.remove("hidden");

  stopCamera();
  document.getElementById("retakeBtn").classList.remove("hidden");
  document.getElementById("startCameraBtn").textContent="OPEN CAMERA AGAIN";
  showMessage("cameraMessage","Photo capture ho gayi. Ab Check In ya Check Out karein.");
};

window.retakePhoto=function(){
  capturedPhoto="";
  document.getElementById("photoPreview").src="";
  document.getElementById("photoPreview").classList.add("hidden");
  document.getElementById("retakeBtn").classList.add("hidden");
  startCamera();
};

window.login=async function(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const btn=document.getElementById("loginBtn");

  if(!email||!password){
    showMessage("loginMessage","Email aur password enter karein.");
    return;
  }

  btn.disabled=true;
  showMessage("loginMessage","Logging in...");

  try{
    await auth.signInWithEmailAndPassword(email,password);
  }catch(e){
    showMessage("loginMessage","Login error: "+e.message);
  }finally{
    btn.disabled=false;
  }
};

window.logout=async function(){
  stopCamera();
  capturedPhoto="";
  await auth.signOut();
};

window.markAttendance=async function(action){
  if(!currentUser||!currentStaff)return;

  const msg=document.getElementById("attendanceMessage");
  const inBtn=document.getElementById("inBtn");
  const outBtn=document.getElementById("outBtn");

  if(!capturedPhoto){
    msg.textContent="Attendance se pehle live camera se photo lena zaroori hai.";
    return;
  }

  inBtn.disabled=true;
  outBtn.disabled=true;

  try{
    const date=datePK();
    const ref=db.collection("attendance").doc(currentUser.uid+"_"+date);
    const snap=await ref.get();
    const now=timePK();

    if(action==="in"){
      if(snap.exists){
        throw new Error("Aaj aapka Check In pehle se laga hua hai.");
      }

      await ref.set({
        uid:currentUser.uid,
        name:currentStaff.name||"Staff",
        date:date,
        checkIn:now,
        checkOut:"",
        checkInPhoto:capturedPhoto,
        checkOutPhoto:"",
        status:"Present",
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });

      msg.textContent="Check In successful! Photo save ho gayi. "+now;
    }else{
      if(!snap.exists)throw new Error("Pehle Check In karein.");
      if(snap.data().checkOut)throw new Error("Check Out pehle ho chuka hai.");

      await ref.update({
        checkOut:now,
        checkOutPhoto:capturedPhoto,
        status:"Completed"
      });

      msg.textContent="Check Out successful! Photo save ho gayi. "+now;
    }

    capturedPhoto="";
    document.getElementById("photoPreview").src="";
    document.getElementById("photoPreview").classList.add("hidden");
    document.getElementById("retakeBtn").classList.add("hidden");
    document.getElementById("startCameraBtn").textContent="OPEN LIVE CAMERA";
    showMessage("cameraMessage","Agli attendance ke liye dobara camera open karein.");

    await loadMyRecords();

  }catch(e){
    msg.textContent="Error: "+e.message;
  }finally{
    inBtn.disabled=false;
    outBtn.disabled=false;
  }
};

async function loadMyRecords(){
  const area=document.getElementById("myRecords");
  area.textContent="Loading...";

  try{
    const snap=await db.collection("attendance")
      .where("uid","==",currentUser.uid).get();

    const arr=[];
    snap.forEach(d=>arr.push(d.data()));
    arr.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    const table=document.createElement("table");
    table.innerHTML="<tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr>";

    arr.slice(0,100).forEach(r=>{
      const tr=document.createElement("tr");
      [r.date,r.checkIn,r.checkOut,r.status].forEach(v=>{
        const td=document.createElement("td");
        td.textContent=v||"";
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });

    area.replaceChildren(table);
  }catch(e){
    area.textContent="Records error: "+e.message;
  }
}

window.loadAdminRecords=async function(){
  const el=document.getElementById("adminMessage");
  el.textContent="Loading records...";

  try{
    const snap=await db.collection("attendance")
      .orderBy("date","desc").limit(500).get();

    records=[];
    snap.forEach(d=>records.push(d.data()));
    el.textContent="Records loaded successfully.";
    renderRecords();
  }catch(e){
    el.textContent="Admin error: "+e.message;
  }
};

window.viewPhoto=function(data){
  if(!data)return;

  const win=window.open();
  if(!win){
    alert("Photo window blocked. Browser mein pop-ups allow karein.");
    return;
  }

  const img=win.document.createElement("img");
  img.src=data;
  img.style="max-width:100%;height:auto";
  win.document.body.appendChild(img);
};

window.renderRecords=function(){
  const search=document.getElementById("searchStaff").value.toLowerCase().trim();
  const day=document.getElementById("filterDay").value;
  const month=document.getElementById("filterMonth").value;

  const filtered=records.filter(r=>
    (r.name||"").toLowerCase().includes(search)&&
    (!day||r.date===day)&&
    (!month||(r.date||"").startsWith(month))
  );

  document.getElementById("totalRecords").textContent=records.length;
  document.getElementById("presentToday").textContent=
    records.filter(r=>r.date===datePK()).length;

  const body=document.getElementById("recordsBody");
  body.replaceChildren();

  if(!filtered.length){
    const tr=document.createElement("tr");
    const td=document.createElement("td");
    td.colSpan=6;
    td.textContent="No records found.";
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }

  filtered.forEach(r=>{
    const tr=document.createElement("tr");

    [r.name,r.date,r.checkIn,r.checkOut,r.status].forEach(v=>{
      const td=document.createElement("td");
      td.textContent=v||"";
      tr.appendChild(td);
    });

    const photoCell=document.createElement("td");

    if(r.checkInPhoto){
      const b=document.createElement("button");
      b.textContent="Check In Photo";
      b.onclick=()=>viewPhoto(r.checkInPhoto);
      photoCell.appendChild(b);
    }

    if(r.checkOutPhoto){
      const b=document.createElement("button");
      b.textContent="Check Out Photo";
      b.onclick=()=>viewPhoto(r.checkOutPhoto);
      photoCell.appendChild(b);
    }

    if(!r.checkInPhoto&&!r.checkOutPhoto){
      photoCell.textContent="No photos";
    }

    tr.appendChild(photoCell);
    body.appendChild(tr);
  });
};

window.clearFilters=function(){
  ["searchStaff","filterDay","filterMonth"].forEach(id=>
    document.getElementById(id).value=""
  );
  renderRecords();
};

try{
  if(!window.firebase)throw new Error("Firebase scripts load nahi huay. Internet check karein.");

  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();

  auth.onAuthStateChanged(async user=>{
    currentUser=user;
    currentStaff=null;
    capturedPhoto="";
    stopCamera();

    if(!user){
      showSection("loginSection");
      return;
    }

    try{
      const profile=await db.collection("STAFF").doc(user.uid).get();

      if(!profile.exists){
        await auth.signOut();
        showMessage("loginMessage","STAFF profile nahi mila. Admin se rabta karein.");
        return;
      }

      currentStaff=profile.data();

      if(currentStaff.role==="admin"){
        showSection("adminSection");
        await loadAdminRecords();
      }else{
        showSection("staffSection");
        document.getElementById("welcome").textContent=
          "Welcome, "+(currentStaff.name||"Staff");
        await loadMyRecords();
      }
    }catch(e){
      await auth.signOut();
      showSection("loginSection");
      showMessage("loginMessage","Account error: "+e.message);
    }
  });

}catch(e){
  showSection("loginSection");
  showMessage("loginMessage","Setup error: "+e.message);
}

window.addEventListener("error",e=>{
  showMessage("loginMessage","Website error: "+e.message);
});
</script>
</body>
</html>
